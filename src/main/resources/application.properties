spring.application.name=labslot

# Formato de fechas y horas de los formularios (<input type="date"> y <input type="time">)
spring.mvc.format.date=iso
spring.mvc.format.time=iso

# Repositorio a usar: mariadb (por defecto) o inmemory. También activa el perfil con el mismo nombre
labslot.repository=mariadb
spring.profiles.active=${labslot.repository}

# MariaDB local. La contraseña se lee de la variable de entorno DB_PASSWORD
spring.datasource.url=jdbc:mariadb://localhost:3306/labslot
spring.datasource.username=labslot
spring.datasource.password=${DB_PASSWORD:}

# Ejecuta schema.sql y data.sql en cada arranque: no borran ni duplican datos
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
#---
spring.config.activate.on-profile=inmemory
# En modo inmemory no se ejecutan los scripts, para que arranque sin MariaDB.
# No poner comentarios pegados a la línea "#---": Spring dejaría de verla como separador
spring.sql.init.mode=never
