<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Reservas')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container flex-grow-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Reservas</h1>
        <!-- Filtro por estado; "Todas" envía state vacío -->
        <form th:action="@{/admin/reservations}" method="get" class="d-flex gap-2">
            <label for="state" class="visually-hidden">Estado</label>
            <select class="form-select" id="state" name="state" onchange="this.form.submit()">
                <option value="">Todas</option>
                <option value="RSTATE_PENDING" th:selected="${selectedState?.name() == 'RSTATE_PENDING'}">Pendientes</option>
                <option value="RSTATE_APPROVED" th:selected="${selectedState?.name() == 'RSTATE_APPROVED'}">Aprobadas</option>
                <option value="RSTATE_REJECTED" th:selected="${selectedState?.name() == 'RSTATE_REJECTED'}">Rechazadas</option>
                <option value="RSTATE_CANCELLED" th:selected="${selectedState?.name() == 'RSTATE_CANCELLED'}">Canceladas</option>
                <option value="RSTATE_COMPLETED" th:selected="${selectedState?.name() == 'RSTATE_COMPLETED'}">Completadas</option>
            </select>
            <button type="submit" class="btn btn-outline-primary">Filtrar</button>
        </form>
    </div>

    <div th:replace="~{layout :: alerts}"></div>

    <!-- Reporte PDF de reservas por rango de fechas -->
    <div class="card shadow-sm mb-3">
        <div class="card-body">
            <h2 class="h6 mb-3">Reporte PDF de reservas</h2>
            <form th:action="@{/admin/reservations/report}" method="get" class="row g-2 align-items-end">
                <div class="col-6 col-md-3">
                    <label for="startDate" class="form-label small mb-1">Fecha inicial</label>
                    <input type="date" class="form-control" id="startDate" name="startDate" required
                           th:value="${reportStartDate}">
                </div>
                <div class="col-6 col-md-3">
                    <label for="endDate" class="form-label small mb-1">Fecha final</label>
                    <input type="date" class="form-control" id="endDate" name="endDate" required
                           th:value="${reportEndDate}">
                </div>
                <div class="col-12 col-md-auto">
                    <button type="submit" class="btn btn-outline-primary">Descargar PDF</button>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Laboratorio</th>
                    <th>Solicitante</th>
                    <th>Fecha</th>
                    <th>Horario</th>
                    <th>Asistentes</th>
                    <th>Propósito</th>
                    <th>Estado</th>
                    <th class="text-end">Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="reservation : ${reservations}"
                    th:with="laboratory=${laboratories[reservation.laboratoryId()]},
                             user=${users[reservation.userId()]},
                             state=${reservation.state().name()}">
                    <td>
                        <strong th:text="${laboratory?.code()}">LAB-SIS-01</strong>
                        <span class="d-block small text-muted" th:text="${laboratory?.name()}">Laboratorio</span>
                    </td>
                    <td th:text="${user?.fullName()}">Nombre</td>
                    <td th:text="${#temporals.format(reservation.date(), 'dd/MM/yyyy')}">18/11/2026</td>
                    <td th:text="${#temporals.format(reservation.startTime(), 'HH:mm')} + ' – ' + ${#temporals.format(reservation.endTime(), 'HH:mm')}">10:00 – 12:00</td>
                    <td th:text="${reservation.attendees()}">20</td>
                    <td th:text="${reservation.purpose()}">Clase</td>
                    <td><span th:replace="~{layout :: stateBadge(${reservation.state()})}"></span></td>
                    <td class="text-end">
                        <!-- Botones según el estado: PENDING → aprobar, rechazar, cancelar; APPROVED → completar, cancelar -->
                        <div class="d-inline-flex flex-wrap justify-content-end gap-1">
                            <form th:if="${state == 'RSTATE_PENDING'}" method="post" class="m-0"
                                  th:action="@{/admin/reservations/{id}/approve(id=${reservation.reservationId()})}">
                                <input type="hidden" name="filter" th:value="${selectedState}">
                                <button type="submit" class="btn btn-success btn-sm">Aprobar</button>
                            </form>
                            <form th:if="${state == 'RSTATE_PENDING'}" method="post" class="m-0"
                                  th:action="@{/admin/reservations/{id}/reject(id=${reservation.reservationId()})}">
                                <input type="hidden" name="filter" th:value="${selectedState}">
                                <button type="submit" class="btn btn-outline-danger btn-sm">Rechazar</button>
                            </form>
                            <form th:if="${state == 'RSTATE_APPROVED'}" method="post" class="m-0"
                                  th:action="@{/admin/reservations/{id}/complete(id=${reservation.reservationId()})}">
                                <input type="hidden" name="filter" th:value="${selectedState}">
                                <button type="submit" class="btn btn-primary btn-sm">Completar</button>
                            </form>
                            <form th:if="${state == 'RSTATE_PENDING' or state == 'RSTATE_APPROVED'}" method="post" class="m-0"
                                  th:action="@{/admin/reservations/{id}/cancel(id=${reservation.reservationId()})}">
                                <input type="hidden" name="filter" th:value="${selectedState}">
                                <button type="submit" class="btn btn-outline-secondary btn-sm"
                                        onclick="return confirm('¿Cancelar esta reserva?')">Cancelar
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${reservations.isEmpty()}">
                    <td colspan="8" class="text-center text-muted py-4">No hay reservas con ese estado</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
    <p class="text-muted small mt-2" th:text="${reservations.size()} + ' reserva(s)'">14 reserva(s)</p>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
