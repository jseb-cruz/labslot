<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Usuarios')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container flex-grow-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Usuarios</h1>
        <a th:href="@{/admin/users/new}" class="btn btn-primary">Nuevo usuario</a>
    </div>

    <div th:replace="~{layout :: alerts}"></div>

    <!-- La contraseña nunca se muestra, ni siquiera cifrada -->
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Nombre</th>
                    <th>Correo</th>
                    <th>Rol</th>
                    <th class="text-end">Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td><strong th:text="${user.fullName()}">Jorge Andrés Castro Pinzón</strong></td>
                    <td th:text="${user.email()}">jorge.castro@usantoto.edu.co</td>
                    <td th:text="${user.role().name() == 'ROLE_ADMIN'} ? 'Administrador' : 'Usuario'">Usuario</td>
                    <td class="text-end">
                        <span th:if="${user.userId() == currentUser.userId()}" class="text-muted small">Tu usuario</span>
                        <form th:unless="${user.userId() == currentUser.userId()}"
                              th:action="@{/admin/users/{id}/delete(id=${user.userId()})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('¿Eliminar este usuario?')">Eliminar
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${users.isEmpty()}">
                    <td colspan="4" class="text-center text-muted py-4">No hay usuarios registrados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
