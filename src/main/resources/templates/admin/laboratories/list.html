<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Laboratorios')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container flex-grow-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Laboratorios</h1>
        <a th:href="@{/admin/laboratories/new}" class="btn btn-primary">Nuevo laboratorio</a>
    </div>

    <div th:replace="~{layout :: alerts}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Edificio</th>
                    <th>Capacidad</th>
                    <th>Estado</th>
                    <th class="text-end">Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="laboratory : ${laboratories}">
                    <td><strong th:text="${laboratory.code()}">LAB-SIS-01</strong></td>
                    <td th:text="${laboratory.name()}">Laboratorio de Sistemas 1</td>
                    <td th:text="${laboratory.building()}">Sede Central - Bloque A</td>
                    <td th:text="${laboratory.capacity()} + ' personas'">30 personas</td>
                    <td><span th:replace="~{layout :: labStateBadge(${laboratory.state()})}"></span></td>
                    <td class="text-end">
                        <form th:action="@{/admin/laboratories/{id}/toggle-state(id=${laboratory.laboratoryId()})}"
                              method="post" class="m-0">
                            <button type="submit" class="btn btn-sm"
                                    th:classappend="${laboratory.state().name() == 'LSTATE_ACTIVE'} ? 'btn-outline-warning' : 'btn-outline-success'"
                                    th:text="${laboratory.state().name() == 'LSTATE_ACTIVE'} ? 'Pasar a mantenimiento' : 'Activar'">
                                Pasar a mantenimiento
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${laboratories.isEmpty()}">
                    <td colspan="6" class="text-center text-muted py-4">No hay laboratorios registrados</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
