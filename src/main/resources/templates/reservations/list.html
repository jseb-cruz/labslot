<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Mis reservas')}"></head>
<body class="bg-light d-flex flex-column min-vh-100">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="container flex-grow-1">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
        <h1 class="h3 mb-0">Mis reservas</h1>
        <a th:href="@{/reservations/new}" class="btn btn-primary">Nueva reserva</a>
    </div>

    <div th:replace="~{layout :: alerts}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Laboratorio</th>
                    <th>Fecha</th>
                    <th>Horario</th>
                    <th>Asistentes</th>
                    <th>Propósito</th>
                    <th>Estado</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="reservation : ${reservations}"
                    th:with="laboratory=${laboratories[reservation.laboratoryId()]}">
                    <td>
                        <strong th:text="${laboratory?.code()}">LAB-SIS-01</strong>
                        <span class="d-block small text-muted" th:text="${laboratory?.name()}">Laboratorio</span>
                    </td>
                    <td th:text="${#temporals.format(reservation.date(), 'dd/MM/yyyy')}">18/11/2026</td>
                    <td th:text="${#temporals.format(reservation.startTime(), 'HH:mm')} + ' – ' + ${#temporals.format(reservation.endTime(), 'HH:mm')}">10:00 – 12:00</td>
                    <td th:text="${reservation.attendees()}">20</td>
                    <td th:text="${reservation.purpose()}">Clase</td>
                    <td><span th:replace="~{layout :: stateBadge(${reservation.state()})}"></span></td>
                    <td class="text-end">
                        <!-- Solo se pueden cancelar las pendientes o aprobadas -->
                        <form th:if="${reservation.state().name() == 'RSTATE_PENDING' or reservation.state().name() == 'RSTATE_APPROVED'}"
                              th:action="@{/reservations/{id}/cancel(id=${reservation.reservationId()})}" method="post" class="m-0">
                            <button type="submit" class="btn btn-outline-danger btn-sm"
                                    onclick="return confirm('¿Cancelar esta reserva?')">Cancelar
                            </button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${reservations.isEmpty()}">
                    <td colspan="7" class="text-center text-muted py-4">No tienes reservas todavía</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<script th:replace="~{layout :: scripts}"></script>
</body>
</html>
